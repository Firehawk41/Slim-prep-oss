[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slim-prep"
version = "0.1.0"
description = "Sample preparation module for the SLIM LIMS ecosystem: the prep book, from weighings to the run list"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    # The results module a ready batch is handed to (P-11). Named, not pinned (slim-data D-117): the app
    # pins it. CI installs slim-data's main first; co-developing: pip install -e ../slim-data-oss
    "slim-data",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "coverage[toml]>=7.5",
    "ruff==0.16.9",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
include = ["slim_prep*"]

[tool.setuptools.package-data]
slim_prep = ["persistence/alembic.ini", "persistence/migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["slim_prep"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
